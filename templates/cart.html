<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Мой Магазин</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Главная</a>
                <a class="nav-link" href="/catalog">Каталог</a>
                <a class="nav-link active" href="/cart">Корзина</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">Ваша корзина</h1>
        
        {% if products %}
            <ul class="list-group mb-3">
                {% for product in products %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <h5>{{ product.name }}</h5>
                        <p class="mb-0 text-muted">{{ product.price }} руб.</p>
                    </div>
                </li>
                {% endfor %}
            </ul>
            <h3 class="text-end">Итого: <span class="text-success">{{ total }} руб.</span></h3>
            <div class="text-end mt-3">
                <button class="btn btn-success btn-lg">Оформить заказ</button>
            </div>
        {% else %}
            <div class="alert alert-info">Ваша корзина пуста.</div>
            <a href="/catalog" class="btn btn-primary">Перейти в каталог</a>
        {% endif %}
    </div>
</body>
</html>
